<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Sleep Outside | Cart</title>

<link rel="stylesheet" href="/css/style.css" />

<!-- Load scripts ONCE -->
<script src="../js/main.js" type="module"></script>
<script src="../js/cart.js" type="module"></script>

<style>

/* CLEAR CART BUTTON */

.clear-cart-btn {
background-color: red;
color: white;
padding: 10px 15px;
border: none;
cursor: pointer;
font-size: 16px;
margin-top: 10px;
}

.clear-cart-btn:hover {
background-color: darkred;
}

/* Quantity buttons */

.qty-btn {
padding: 5px 10px;
margin: 0 5px;
font-size: 16px;
cursor: pointer;
}

/* Cart item */

.cart-item {
margin-bottom: 15px;
list-style: none;
border-bottom: 1px solid #ccc;
padding-bottom: 10px;
}

</style>

</head>

<body>

<header class="divider">

<div class="logo">

<img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />

<a href="/index.html">

Sleep<span class="highlight">Outside</span>

</a>

</div>

<div class="cart">

<a href="/cart/index.html">

🛒

<span id="cart-count">0</span>

</a>

</div>

</header>

<main class="divider">

<section class="products">

<h2>My Cart</h2>

<ul
class="product-list"
id="cartContainer">
</ul>

<div class="cart-footer">

<h3>

Total:

<span id="cartTotal">

$0.00

</span>

</h3>

<button
id="clearCartBtn"
class="clear-cart-btn">

Clear Cart

</button>

</div>

</section>

</main>

<footer>

&copy; NOT a real business
